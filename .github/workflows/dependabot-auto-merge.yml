name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # the PR author, not github.actor (which is whoever triggered this run, e.g. a re-run)
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge patch and minor bumps only. A minor bump from 0.x is breaking
      # under semver, so any dependency in the PR (grouped PRs included) whose
      # previous version is 0.x keeps the PR for manual review.
      - name: Enable auto-merge
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          ZERO_MINOR=$(jq -r '[.[] | select(.updateType == "version-update:semver-minor" and ((.prevVersion // "") | test("^v?0\\.")))] | map(.dependencyName) | join(", ")' <<< "$UPDATED_DEPENDENCIES")
          if [ -n "$ZERO_MINOR" ]; then
            echo "Skipping auto-merge: 0.x minor bump of $ZERO_MINOR"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
