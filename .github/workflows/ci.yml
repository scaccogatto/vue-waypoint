name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Node 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Package checks (publint, arethetypeswrong)
        run: npm run lint:package

      - name: Build demo
        run: npm run build-only

      # keep the peerDependencies floor honest: rerun the tests against the
      # oldest Vue the package claims to support (last step, it rewrites node_modules)
      - name: Test against the minimum supported Vue
        run: |
          MIN_VUE=$(node -p "require('./package.json').peerDependencies.vue.replace(/^\\^/, '')")
          npm pkg set "devDependencies.vue=$MIN_VUE" "devDependencies.@vue/server-renderer=$MIN_VUE" "overrides.vue=$MIN_VUE"
          npm install --no-audit --no-fund
          node -p "'vue ' + require('vue/package.json').version"
          npm test
